name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  package:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Validate and test
        run: |
          swift package dump-package >/dev/null
          ./scripts/test.sh
      - name: Build unsigned app
        env:
          SAKURA_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.1.0' }}
          SAKURA_BUILD: ${{ github.run_number }}
        run: |
          export SAKURA_VERSION="${SAKURA_VERSION#v}"
          ./scripts/package.sh
      - name: Create archive and checksum
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/SakuraPlayer.app dist/SakuraPlayer-unsigned-macos.zip
          shasum -a 256 dist/SakuraPlayer-unsigned-macos.zip > dist/SakuraPlayer-unsigned-macos.zip.sha256
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SakuraPlayer-release
          path: |
            dist/SakuraPlayer-unsigned-macos.zip
            dist/SakuraPlayer-unsigned-macos.zip.sha256
      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SakuraPlayer-unsigned-macos.zip
            dist/SakuraPlayer-unsigned-macos.zip.sha256
          generate_release_notes: true
