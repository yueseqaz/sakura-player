name: macOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Validate package manifest
        run: swift package dump-package >/dev/null
      - name: Build app
        run: |
          swift build --configuration debug --product SakuraPlayer
          swift build --configuration debug --target SakuraPlayerApp
      - name: Run core checks
        run: |
          set -o pipefail
          ./scripts/test.sh | tee core-checks.log
      - name: Upload check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SakuraPlayer-core-checks
          path: core-checks.log
      - name: Package unsigned development app
        env:
          SAKURA_BUILD: ${{ github.run_number }}
        run: |
          ./scripts/package.sh
          ditto -c -k --sequesterRsrc --keepParent dist/SakuraPlayer.app dist/SakuraPlayer-unsigned-macos.zip
      - name: Upload development app
        uses: actions/upload-artifact@v4
        with:
          name: SakuraPlayer-unsigned-macos
          path: dist/SakuraPlayer-unsigned-macos.zip
